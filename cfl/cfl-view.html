<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FA-23 — Critical Field Length — No Drag Chute</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1016;color:#e9eef5;font-family:Arial,Helvetica,sans-serif}header{padding:14px 18px;border-bottom:1px solid #26313d;background:#111923;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#9eabb8;font-size:12px}.badge{font-weight:700;color:#9fd7ff;border:1px solid #31516b;padding:7px 10px;border-radius:8px}.app{display:grid;grid-template-columns:350px 1fr;height:calc(100vh - 72px)}.panel{padding:14px;overflow:auto;border-right:1px solid #26313d;background:#0f151d}.card{background:#141d27;border:1px solid #26313d;border-radius:10px;padding:13px;margin-bottom:12px}.card h2{font-size:12px;letter-spacing:.08em;margin:0 0 12px;color:#aebbc8}label{display:block;font-size:12px;color:#b8c4cf;margin:10px 0 5px}input,select{width:100%;padding:9px 10px;background:#0c1219;color:#eef3f8;border:1px solid #334252;border-radius:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:9px 12px;border-radius:7px;border:1px solid #3a4a5b;background:#182330;color:#e9eef5;cursor:pointer}button.primary{width:100%;margin-top:13px;background:#1d6fa5;border-color:#3189c3;font-weight:700}.status{font-size:12px;color:#b9c5d0;line-height:1.5}.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:10px;border:1px solid #2b3947;border-radius:8px;background:#101821}.metric span{display:block;font-size:10px;color:#8f9eac}.metric b{font-size:21px;display:inline-block;margin-top:4px}.trace{margin:0;padding-left:22px;font-size:11px;line-height:1.8;color:#c5d0da}.workspace{padding:12px;overflow:auto;background:#080d13}.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:10px}.zoom{font-size:12px;min-width:50px;text-align:center;color:#aebbc8}.viewport{background:#05080c;border:1px solid #26313d;border-radius:10px;overflow:auto;max-height:calc(100vh - 110px)}.stage{position:relative;width:696px;height:781px;transform-origin:top left}.stage img{position:absolute;left:0;top:0;width:696px;height:781px;display:block}#overlay{position:absolute;left:0;top:0;width:696px;height:781px;pointer-events:none}.pathLine{stroke:#d42929;stroke-width:2.8;fill:none;stroke-linecap:round}.pathPoint{fill:#ffcc00;stroke:#101820;stroke-width:1.5}.pathText{font:700 12px Arial;fill:#00e5ff;paint-order:stroke;stroke:#071018;stroke-width:3px}@media(max-width:900px){.app{grid-template-columns:320px 1fr}}
</style></head><body><header><div><h1>FA-23 · CRITICAL FIELD LENGTH — NO DRAG CHUTE</h1><p>Recorrido vinculado al TOLD ALA-23</p></div><div class="badge">CFL</div></header><div class="app"><aside class="panel"><section class="card"><h2>DATOS RECIBIDOS DEL TOLD</h2><div class="grid2"><div><label>Takeoff Factor</label><input id="tof" type="number" readonly></div><div><label>Gross Weight (lb)</label><input id="gw" type="number" readonly></div></div><div><label>Viento</label><input id="windOut" type="text" readonly></div><div class="grid2"><div><label>CG (% MAC)</label><input id="cg" type="number" readonly></div><div><label>RCR</label><input id="rcr" type="number" readonly></div></div><button id="calculate" class="primary">CALCULAR RECORRIDO</button></section><section class="card"><h2>RESULTADO</h2><div id="status" class="status">—</div><div class="resultGrid"><div class="metric"><span>Critical Field Length</span><b id="cfl">—</b></div><div class="metric"><span>Longitud</span><b id="cflFt">—</b></div></div></section><section class="card"><h2>RECORRIDO</h2><ol id="trace" class="trace"><li>Sin calcular.</li></ol></section></aside><main class="workspace"><div class="toolbar"><button id="minus">−</button><span id="zoom" class="zoom">100%</span><button id="plus">+</button><button id="reset">Restablecer</button><span style="flex:1"></span><span style="font-size:11px;color:#8997a5">Carta original + recorrido calculado</span></div><div class="viewport" id="viewport"><div class="stage" id="stage"><img src="../DATA/FA23-CFL-NoDragChute.png" alt="FA-23 Critical Field Length"><svg id="overlay" viewBox="0 0 696 781" preserveAspectRatio="none"></svg></div></div></main></div><script src="../DATA/FA23-CFL-NoDragChute.js"></script><script src="cfl-engine.js"></script><script>
const $=id=>document.getElementById(id),overlay=$("overlay"),stage=$("stage"),viewport=$("viewport");let zoom=1;function line(a,b){const e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y);e.setAttribute('class','pathLine');overlay.appendChild(e)}function point(p,n){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',5);c.setAttribute('class','pathPoint');overlay.appendChild(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',p.x+7);t.setAttribute('y',p.y-7);t.setAttribute('class','pathText');t.textContent=n;overlay.appendChild(t)}function draw(r){overlay.innerHTML='';if(!r||!r.valid)return;const p=r.path,pts=[p.tof,p.gw,p.windBase,p.wind,p.base2,p.cg,...(r.trace.cgUpper?[p.cgBaseline]:[]),p.base3,p.rcr,p.cfl];for(let i=0;i<pts.length-1;i++)line(pts[i],pts[i+1]);pts.forEach((x,i)=>point(x,i+1))}function load(){const q=new URLSearchParams(location.search);const vals={takeoffFactor:Number(q.get('tof')||6.5),grossWeight:Number(q.get('gw')||16000),headwind:Number(q.get('headwind')||0),tailwind:Number(q.get('tailwind')||0),cg:Number(q.get('cg')||15),rcr:Number(q.get('rcr')||23)};$("tof").value=vals.takeoffFactor;$("gw").value=vals.grossWeight;$("cg").value=vals.cg;$("rcr").value=vals.rcr;$("windOut").value=vals.headwind>0.05?`Frente ${vals.headwind.toFixed(1)} kt`:vals.tailwind>0.05?`Cola ${vals.tailwind.toFixed(1)} kt`:'Sin viento';run(vals)}function run(v){const r=window.calculateFA23CFL(v);if(!r.valid){$("status").textContent=r.message;$("cfl").textContent='—';$("cflFt").textContent='—';$("trace").innerHTML='<li>Sin recorrido.</li>';draw(null);return}$("status").textContent='RECORRIDO CALCULADO';$("cfl").textContent=r.result.cfl.toFixed(2);$("cflFt").textContent=r.result.cflFt.toLocaleString('es-ES')+' ft';$("trace").innerHTML='';const t=[`TOF ${r.inputs.takeoffFactor.toFixed(2)} → Gross Weight ${r.inputs.grossWeight.toLocaleString('es-ES')} lb.`,`Gross Weight → VERTICAL hasta BASELINE 1.`,r.inputs.windType==='none'?'Sin viento.':`${r.inputs.windType==='headwind'?'Viento de frente':'Viento de cola'} ${r.inputs.wind.toFixed(1)} kt → paralelo a las líneas de viento.`,`Punto de viento → VERTICAL hasta BASELINE 2 (CG 15 %).`,r.trace.cgUpper?`CG ${r.inputs.cg.toFixed(1)} % → VERTICAL hasta CG → paralelo hacia abajo hasta BASELINE → VERTICAL a BASELINE 3.`:`CG ${r.inputs.cg.toFixed(1)} % → paralelo desde BASELINE hasta CG → VERTICAL a BASELINE 3.`,`RCR ${r.inputs.rcr.toFixed(0)} → escala CFL.`,`CFL = ${r.result.cfl.toFixed(2)} × 1000 ft = ${r.result.cflFt.toLocaleString('es-ES')} ft.`];t.forEach(x=>{const li=document.createElement('li');li.textContent=x;$("trace").appendChild(li)});draw(r)}$("calculate").onclick=()=>{const q=new URLSearchParams(location.search);run({takeoffFactor:Number(q.get('tof')),grossWeight:Number(q.get('gw')),headwind:Number(q.get('headwind')||0),tailwind:Number(q.get('tailwind')||0),cg:Number(q.get('cg')),rcr:Number(q.get('rcr')||23)})};function setZoom(z){zoom=Math.max(.5,Math.min(2.5,z));stage.style.transform=`scale(${zoom})`;$("zoom").textContent=Math.round(zoom*100)+'%'}$("plus").onclick=()=>setZoom(zoom*1.25);$("minus").onclick=()=>setZoom(zoom/1.25);$("reset").onclick=()=>setZoom(1);load();
</script></body></html>
