<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FA-23 — Refusal / CEF — Chute</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101820;color:#eef4f7}
.app{display:grid;grid-template-columns:350px 1fr;height:100vh}
.panel{padding:18px;background:#111c24;border-right:1px solid #344753;overflow:auto}
h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#91a7b5;margin-bottom:18px}
h2{font-size:12px;color:#a8c2d3;letter-spacing:.08em;border-bottom:1px solid #344753;padding-bottom:8px;margin-top:20px}
.card{margin-top:10px;padding:12px;border:1px solid #344753;border-radius:7px;background:#14222b}
.small{font-size:11px;line-height:1.5;color:#a9bbc5}.result{font-size:25px;font-weight:bold;margin-top:4px}.ok{color:#7ee2ad}.error{color:#ff9696}.over-limit{color:#35d06f}.value{font-size:15px;font-weight:bold}
.viewport{overflow:auto;background:#26333b;padding:20px}
.stage{position:relative;width:min(760px,100%);aspect-ratio:760 / 849;height:auto;margin:0 auto;background:#fff}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%}.stage svg{pointer-events:none}
.path{stroke:#eb0909;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cef-path{stroke:#23f80b;stroke-width:3;stroke-dasharray:8 5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.point{fill:#19c86a;stroke:#fff;stroke-width:1.5}.text{font:700 13px Arial;fill:#08783a;paint-order:stroke;stroke:#fff;stroke-width:3px}
.limit{font:700 14px Arial;fill:#08783a;paint-order:stroke;stroke:#fff;stroke-width:3px}
@media(max-width:850px){.app{grid-template-columns:1fr;height:auto}.viewport{height:80vh}}
</style>
</head>
<body>
<div class="app">
<aside class="panel">
<h1>REFUSAL SPEED - WITH DRAG CHUTE</h1>
<div class="sub">REFUSAL SPEED / CRITICAL ENGINE FAILURE SPEED — CHUTE</div>
<h2>DATOS RECIBIDOS DEL TOLD</h2>
<div class="card small">TOF<br><span class="value" id="tof">—</span></div>
<div class="card small">GROSS WEIGHT<br><span class="value" id="gw">—</span> lb</div>
<div class="card small">CRITICAL FIELD LENGTH<br><span class="value" id="cfl">—</span> ft</div>
<div class="card small">RCR<br><span class="value" id="rcr">—</span></div>
<div class="card small">RUNWAY LENGTH<br><span class="value" id="runway">—</span> ft</div>
<div class="card"><div class="small">REFUSAL SPEED — CHUTE</div><div class="result" id="refusal">—</div></div>
<div class="card"><div class="small">CRITICAL ENGINE FAILURE SPEED — CHUTE</div><div class="result" id="cef">—</div></div>
<div class="card small" id="status">Cargando tabla...</div>
<div class="card small" id="steps">—</div>
</aside>
<main class="viewport"><div class="stage">
  <img src="../data/FA23-CFL-Refusal-CEF-CHUTE-original.png" alt="FA-23 Refusal Speed / Critical Engine Failure Speed">
  <svg id="svg" viewBox="0 0 760 849"></svg>
</div></main>
</div>
<script src="FA23_Refusal_Chute_Engine.js"></script>
<script>
(async function(){
  const q=new URLSearchParams(location.search);
  const dataUrl="FA23_Refusal_Chute_Digitalizacion.json";
  const status=document.getElementById('status');
  const fmt=n=>Number(n).toLocaleString('es-ES');
  try{
    const data=await fetch(dataUrl).then(r=>{if(!r.ok)throw new Error('No se pudo cargar la digitalización CHUTE.');return r.json();});
    const input={tof:Number(q.get('tof')),grossWeight:Number(q.get('gw')),cflFt:Number(q.get('cfl')),rcr:Number(q.get('rcr')),runwayLengthFt:Number(q.get('runwayLength'))};
    document.getElementById('tof').textContent=Number.isFinite(input.tof)?input.tof.toFixed(2):'—';
    document.getElementById('gw').textContent=Number.isFinite(input.grossWeight)?Math.round(input.grossWeight).toLocaleString('es-ES'):'—';
    document.getElementById('cfl').textContent=Number.isFinite(input.cflFt)?Math.round(input.cflFt).toLocaleString('es-ES'):'—';
    document.getElementById('runway').textContent=Number.isFinite(input.runwayLengthFt)?Math.round(input.runwayLengthFt).toLocaleString('es-ES'):'—';
    document.getElementById('rcr').textContent=Number.isFinite(input.rcr)?input.rcr.toFixed(0):'—';
    const result=window.FA23RefusalChute.calculate(data,input);
    if(!result.valid){status.textContent='✗ '+result.message;status.className='card small error';return;}
    const svg=document.getElementById('svg');
    function drawPath(path,cls){for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1];if(![a.x,a.y,b.x,b.y].every(Number.isFinite))continue;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);l.setAttribute('class',cls);svg.appendChild(l);}}
    drawPath(result.refusalPath,'path');
    drawPath(result.cefPath,'cef-path');
    Object.entries(result.points).forEach(([name,p])=>{if(!p||![p.x,p.y].every(Number.isFinite))return;const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',5);c.setAttribute('class','point');svg.appendChild(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',p.x+8);t.setAttribute('y',p.y-8);t.setAttribute('class','text');t.textContent=name==='rwyCfl'?'CFL':name==='runway'?'RWY':name==='grossWeight'?'GW':name==='refusalSpeed'?'Vref':name==='cefSpeed'?'Vcef':'TOF';svg.appendChild(t);});
    if(result.result.refusalOver180){const t=document.createElementNS('http://www.w3.org/2000/svg','text');const p=result.points.refusalSpeed;t.setAttribute('x',p.x+8);t.setAttribute('y',p.y+24);t.setAttribute('class','limit');t.textContent='>180 KIAS';svg.appendChild(t);}
    document.getElementById('refusal').textContent=result.result.refusalDisplay+' KIAS';
    document.getElementById('cef').textContent=result.result.cefDisplay+' KIAS';
    document.getElementById('refusal').classList.toggle('over-limit',result.result.refusalOver180===true);
    document.getElementById('cef').classList.toggle('over-limit',result.result.cefOver180===true);
    status.textContent='✓ Recorrido CHUTE calculado';status.className='card small ok';
    document.getElementById('steps').innerHTML='TOF '+input.tof.toFixed(2)+' → GW '+fmt(Math.round(input.grossWeight))+' lb<br>RWY '+fmt(Math.round(input.runwayLengthFt))+' ft → CFL '+fmt(Math.round(input.cflFt))+' ft → RCR '+input.rcr.toFixed(0)+'<br>REFUSAL CHUTE → '+result.result.refusalDisplay+' KIAS<br>CEF CHUTE → '+result.result.cefDisplay+' KIAS';
  }catch(e){status.textContent='✗ '+e.message;status.className='card small error';}
})();
</script>
</body>
</html>
