<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FA-23 — Gradiente Tren Arriba</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#0d151c;color:#edf4f8}body{overflow:auto}.app{display:grid;grid-template-columns:390px 1fr;min-height:100vh}.panel{padding:18px 16px;background:#101a22;border-right:1px solid #31424e;overflow:auto}h1{font-size:19px;margin:0 0 4px}h2{font-size:13px;letter-spacing:.08em;color:#a8c2d3;border-bottom:1px solid #30424f;padding-bottom:8px;margin:20px 0 10px}.sub{font-size:12px;color:#91a8b8;margin-bottom:18px}label{display:block;font-size:12px;color:#a8c2d3;margin:9px 0 5px}input,button{font:inherit;color:#edf4f8;background:#15232d;border:1px solid #405765;border-radius:7px}input{width:100%;padding:10px}button{padding:9px 12px;cursor:pointer;margin:4px 4px 0 0}button:hover{background:#1d313e}.primary{background:#2377a6;border-color:#4b9dca}.card{background:#14212a;border:1px solid #304450;border-radius:8px;padding:12px;margin-top:10px}.status{padding:10px;border-radius:7px;background:#14212a;border:1px solid #304450;font-size:12px;line-height:1.5}.status.ok{border-color:#31815b;color:#8be2b4;background:#10261d}.status.error{border-color:#a85454;color:#ffb4b4;background:#281719}.result{display:grid;grid-template-columns:1fr auto auto;align-items:end;gap:8px;padding:8px 0;border-bottom:1px solid #263741}.result:last-child{border-bottom:0}.result span{font-size:12px;color:#a8c2d3}.result strong{font-size:22px}.result small{font-size:11px;color:#8fa3af}.trace{font-size:12px;line-height:1.55;margin:8px 0 0;padding-left:20px}.chartWrap{min-width:0;background:#26323a;padding:16px;overflow:auto}.toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;position:sticky;top:0;z-index:2}.zoom{min-width:56px;text-align:center;font-weight:bold;color:#d5e2e8}.chartStage{position:relative;width:633px;height:783px;background:#fff;margin:0 auto;box-shadow:0 0 0 1px #18242b}.chartStage img,.chartStage svg{position:absolute;inset:0;width:100%;height:100%;display:block}.chartStage svg{pointer-events:none;overflow:visible}.helper{stroke:#f30707;stroke-width:1.8;fill:none;stroke-dasharray:5 4}.point{fill:#ff3030;stroke:#fff;stroke-width:1.5}.final{fill:#00d084;stroke:#fff;stroke-width:1.5}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{border-right:0;border-bottom:1px solid #31424e}.chartWrap{padding:10px}.chartStage{margin:0}}
</style></head><body>
<div class="app"><aside class="panel"><h1>ANÁLISIS DE GRADIENTE - TREN ARRIBA</h1><div class="sub">TREN ARRIBA · RECORRIDO TOLD</div>
<div class="card"><h2>DATOS DE ENTRADA</h2>
<label>Takeoff Factor<input id="tof" type="number" min="2" max="10" step="0.01" value="4.00"></label>
<label>Pressure Altitude (ft)<input id="pa" type="number" min="0" max="8000" step="50" value="2500"></label>
<label>Gross Weight (lb)<input id="gw" type="number" min="10000" max="20000" step="50" value="10500"></label>
<label>Tailwind (kt)<input id="tailwind" type="number" min="0" max="40" step="0.1" value="7"></label>
<button id="calc" class="primary">CALCULAR RECORRIDO</button><button id="reset">RESTABLECER</button></div>
<div id="status" class="status card">Listo para calcular.</div>
<div class="card"><h2>RESULTADOS</h2><div class="result"><span>Rate of Climb</span><strong id="roc">—</strong><small>ft/min</small></div><div class="result"><span>Gradient</span><strong id="grad">—</strong><small>%</small></div><div class="result"><span>Climb Gradient</span><strong id="ftnm">—</strong><small>ft/NM</small></div></div>
<div class="card"><h2>RECORRIDO</h2><ol id="trace" class="trace"></ol></div></aside>
<main class="chartWrap"><div class="toolbar"><button id="minus">−</button><span id="zoom" class="zoom">100%</span><button id="plus">+</button><button id="resetView">RESTABLECER VISTA</button></div><div class="chartStage" id="stage"><img id="chart" alt="FA-23 Gradiente Tren Arriba"><svg id="svg" viewBox="0 0 633 783" preserveAspectRatio="none"></svg></div></main></div>
<script src="gradient-data.js"></script><script src="gradient-engine.js"></script><script>
const $=id=>document.getElementById(id),svg=$("svg"),stage=$("stage"),chart=$("chart");
function clear(){svg.innerHTML=""}function circle(x,y,cls="point",r=5){const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);c.setAttribute("class",cls);svg.appendChild(c)}function line(x1,y1,x2,y2,cls="helper"){const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class",cls);svg.appendChild(l)}
function draw(r){clear();const p=r.path;line(p.tofAxis.x,p.tofAxis.y,p.tof.x,p.tof.y);circle(p.tofAxis.x,p.tofAxis.y);circle(p.tof.x,p.tof.y);if(Math.abs(p.paLower.y-p.paUpper.y)>0.5){circle(p.paLower.x,p.paLower.y);circle(p.paUpper.x,p.paUpper.y)}line(p.tof.x,p.tof.y,p.gw.x,p.gw.y);circle(p.gw.x,p.gw.y);line(p.gw.x,p.gw.y,p.roc.x,p.roc.y);circle(p.roc.x,p.roc.y);line(p.roc.x,p.roc.y,p.reference.x,p.reference.y);circle(p.reference.x,p.reference.y);line(p.reference.x,p.reference.y,p.baseline.x,p.baseline.y);circle(p.baseline.x,p.baseline.y);line(p.baseline.x,p.baseline.y,p.guidelineTail.x,p.guidelineTail.y);if(Math.abs(p.guidelineUpperBase.y-p.guidelineLowerBase.y)>0.5){circle(p.guidelineLowerBase.x,p.guidelineLowerBase.y);circle(p.guidelineUpperBase.x,p.guidelineUpperBase.y)}circle(p.guidelineTail.x,p.guidelineTail.y,"final",5);line(p.guidelineTail.x,p.guidelineTail.y,p.ftNm.x,p.ftNm.y);circle(p.gradient.x,p.gradient.y,"final",4);circle(p.ftNm.x,p.ftNm.y,"final",4)}
function render(r){$("status").className="status card ok";$("status").textContent="✓ RECORRIDO CALCULADO — datos dentro del rango digitalizado.";$("roc").textContent=r.result.rateOfClimb.toFixed(0);$("grad").textContent=r.result.gradientPercent.toFixed(2);$("ftnm").textContent=r.result.gradientFtNm.toFixed(0);const pa=r.interpolation.pressureAltitude,gw=r.interpolation.grossWeight,gl=r.interpolation.guideline;$("trace").innerHTML=[`1. TOF → PA: ${r.inputs.takeoffFactor.toFixed(2)} → PA ${r.inputs.pressureAltitude.toFixed(0)} ft`,`2. PA interpolada: ${pa.lower} ↔ ${pa.upper} ft · ${(pa.fraction*100).toFixed(1)}%`,`3. PA → Gross Weight: ${r.inputs.grossWeight.toFixed(0)} lb · interpolación continua`,`4. Gross Weight → Rate of Climb: ${r.result.rateOfClimb.toFixed(0)} ft/min`,`5. Descenso vertical → Reference Curve`,`6. Reference Curve → Baseline vertical`,`7. Guidelines: #${gl.lower} ↔ #${gl.upper} · ${(gl.fraction*100).toFixed(1)}%`,`8. Desplazamiento por guideline → Tailwind ${r.inputs.tailwind.toFixed(1)} kt`,`9. Lectura horizontal → Gradient ${r.result.gradientPercent.toFixed(2)}%`,`10. Climb Gradient: ${r.result.gradientFtNm.toFixed(0)} ft/NM`].map(x=>`<li>${x}</li>`).join("");draw(r)}
function calculate(){const r=window.calculateFA23GradientTrenArriba({takeoffFactor:$("tof").value,pressureAltitude:$("pa").value,grossWeight:$("gw").value,tailwind:$("tailwind").value});if(!r.valid){clear();$("roc").textContent="—";$("grad").textContent="—";$("ftnm").textContent="—";$("status").className="status card error";$("status").textContent="✕ "+r.message;$("trace").innerHTML="";return}render(r)}
$("calc").onclick=calculate;$("reset").onclick=()=>location.reload();let zoom=1;function setZoom(z){zoom=Math.max(.5,Math.min(4,z));stage.style.width=633*zoom+"px";stage.style.height=783*zoom+"px";$("zoom").textContent=Math.round(zoom*100)+"%"}$("plus").onclick=()=>setZoom(zoom*1.25);$("minus").onclick=()=>setZoom(zoom/1.25);$("resetView").onclick=()=>setZoom(1);
const q=new URLSearchParams(location.search);if(q.get("tof")!==null)$("tof").value=q.get("tof");if(q.get("pa")!==null)$("pa").value=q.get("pa");if(q.get("gw")!==null)$("gw").value=q.get("gw");if(q.get("tailwind")!==null)$("tailwind").value=q.get("tailwind");chart.src="FA23-Gradiente.png";calculate();
</script></body></html>
